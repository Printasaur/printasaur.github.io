<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printasaur | Kolekcija 🦖</title>
    <style>
        :root { --main-green: #9ACD32; --dark-bg: #0a0a0a; --card-bg: #111111; --border-color: #222; }
        
        body { 
            background-color: var(--dark-bg); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }

        .nav-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        .nav-links { display: flex; gap: 15px; }

        .nav-btn {
            background: #1a1a1a;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: 0.3s;
        }

        .nav-btn:hover { background: var(--main-green); color: black; border-color: var(--main-green); }
        .nav-btn.active { border-color: var(--main-green); color: var(--main-green); background: rgba(154, 205, 50, 0.1); }

        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 40px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h1 { color: var(--main-green); text-transform: uppercase; margin-bottom: 30px; }

        /* Šeit būs tavs produktu režģis */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .item {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 20px;
            border: 1px solid #222;
        }

        .item img { width: 100%; border-radius: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div style="font-weight: 800; font-size: 1.2rem; color: var(--main-green);">PRINTASAUR</div>
    <div class="nav-links">
        <a href="index.html" class="nav-btn">Idea Lab</a>
        <a href="#" class="nav-btn active">Kolekcija</a>
    </div>
</div>

<div class="container">
    <h1>Mūsu Piedāvājums</h1>
    <p style="color: #999;">Šeit drīzumā varēsi apskatīt un pasūtīt labākos Printasaur modeļus.</p>
    
    <div class="grid">
        <div class="item">
            <div style="height: 150px; background: #333; border-radius: 12px; display: flex; align-items: center; justify-content: center;">Bilde 1</div>
            <p>Dino Piekariņš</p>
        </div>
        <div class="item">
            <div style="height: 150px; background: #333; border-radius: 12px; display: flex; align-items: center; justify-content: center;">Bilde 2</div>
            <p>CS Specprojekts</p>
        </div>
    </div>
</div>

</body>
</html>
