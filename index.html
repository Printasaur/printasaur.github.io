<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printasaur | Idea Lab 🦖</title>
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #ffffff; 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0; 
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container { 
            max-width: 550px; 
            width: 100%; 
            text-align: center;
        }

        .logo { 
            width: 120px; 
            margin-bottom: 25px;
            border-radius: 50%;
            border: 2px solid #9ACD32;
            padding: 5px;
        }

        h1 { 
            font-size: 2.2rem;
            letter-spacing: -1px;
            margin: 0 0 15px 0;
            font-weight: 800;
            color: #9ACD32;
        }

        .description { 
            font-size: 1.05rem; 
            color: #999; 
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .highlight { color: #fff; font-weight: 600; }

        /* Moderns rāmis formai */
        .form-container {
            background: #111;
            border-radius: 20px;
            border: 1px solid #222;
            padding: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #444;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.jpg" class="logo" alt="Printasaur">
    
    <h1>IDEA LAB</h1>
    
    <div class="description">
        Testējam jaunus dizainus! <span class="highlight">Kādu piekariņu mums vajadzētu izprintēt nākamo?</span> 
        Uzraksti savu domu un skaties, kā tā atdzīvojas veikalā.
    </div>

    <div class="form-container">
        <iframe data-tally-src="https://tally.so/embed/RGRaL4?hideTitle=1&transparentBackground=1&dynamicHeight=1" 
                loading="lazy" width="100%" height="400" frameborder="0" marginheight="0" marginwidth="0">
        </iframe>
    </div>

    <footer>PRINTASAUR &copy; 2026 | BUILT BY CS STUDENT</footer>
</div>

<script async src="https://tally.so/Widgets/embed.js"></script>
</body>
</html>
