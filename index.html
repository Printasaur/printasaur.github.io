<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printasaur Idea Lab 🦖</title>
    <style>
        /* Pamata stils - Tumšais režīms */
        body { 
            background-color: #0a0a0a; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        .container { 
            max-width: 600px; 
            width: 90%; 
            background: #151515; 
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid #333;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Logo stils */
        .logo { 
            width: 180px; 
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(154, 205, 50, 0.2));
        }

        /* Virsraksts ar gradientu no logo krāsām */
        h1 { 
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #9ACD32, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        /* Tavs izvēlētais teksts */
        .description { 
            font-size: 1.1rem; 
            color: #cccccc; 
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .highlight {
            color: #9ACD32;
            font-weight: 600;
        }

        /* Tally Embed konteiners */
        .form-wrapper {
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.jpg" class="logo" alt="Printasaur">
    
    <h1>IDEA LAB</h1>
    
    <div class="description">
        Testējam jaunus dizainus! <span class="highlight">Kādu piekariņu mums vajadzētu izprintēt nākamo?</span> 
        Uzraksti savu domu un gaidi, kad tā parādīsies veikalā.
    </div>

    <div class="form-wrapper">
        <iframe data-tally-src="https://tally.so/embed/RGRaL4?hideTitle=1&transparentBackground=1&dynamicHeight=1" 
                loading="lazy" width="100%" height="450" frameborder="0" marginheight="0" marginwidth="0" title="Suggestions">
        </iframe>
        <script>var d=document,w="https://tally.so/Widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]'))v();else{var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>
    </div>

    <footer>Printasaur &copy; 2026 | Built by CS Student</footer>
</div>

</body>
</html>
