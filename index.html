<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printasaur | Idea Lab 🦖</title>
    <style>
        :root { 
            --main-green: #9ACD32; 
            --dark-bg: #0a0a0a; 
            --card-bg: #111111; 
            --border-color: #222;
        }
        
        body { 
            background-color: var(--dark-bg); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }

        /* Navigācijas josla augšā */
        .nav-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: #1a1a1a;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: var(--main-green);
            color: black;
            border-color: var(--main-green);
        }

        .nav-btn.active {
            border-color: var(--main-green);
            color: var(--main-green);
            background: rgba(154, 205, 50, 0.1);
        }

        /* Galvenais Dashboard rāmis */
        .dashboard { 
            display: grid; 
            grid-template-columns: 1fr 1.4fr; 
            max-width: 1000px; 
            width: 100%; 
            background: var(--card-bg); 
            border-radius: 28px; 
            overflow: hidden; 
            border: 1px solid var(--border-color);
            box-shadow: 0 40px 100px rgba(0,0,0,0.7);
        }

        .sidebar { padding: 60px 40px; border-right: 1px solid var(--border-color); background: linear-gradient(180deg, #161616 0%, #0a0a0a 100%); }
        .logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--main-green); padding: 5px; margin-bottom: 20px; }
        h1 { color: var(--main-green); font-size: 2.2rem; margin: 0; line-height: 1; font-weight: 800; }
        .tagline { color: #555; font-size: 0.75rem; margin-top: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .description { margin-top: 30px; color: #999; line-height: 1.6; font-size: 1rem; }
        .main-content { background: #0d0d0d; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 850px) {
            .dashboard { grid-template-columns: 1fr; }
            .sidebar { padding: 40px 30px; text-align: center; border-right: none; border-bottom: 1px solid var(--border-color); align-items: center; }
            .nav-bar { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

<div class="nav-bar">
    <div style="font-weight: 800; font-size: 1.2rem; color: var(--main-green);">PRINTASAUR</div>
    <div class="nav-links">
        <a href="#" class="nav-btn active">Idea Lab</a>
        <a href="https://tava-saite.lv/kolekcija" class="nav-btn">Kolekcija</a>
    </div>
</div>

<div class="dashboard">
    <div class="sidebar">
        <img src="logo.jpg" class="logo" alt="Printasaur">
        <h1>IDEA<br>LAB</h1>
        <div class="tagline">Bambu Lab P1S Station</div>
        <p class="description">
            Testējam jaunus dizainus! <br><br>
            Iesaki savu ideju un skaties, kā tā atdzīvojas mūsu veikala stendā.
        </p>
    </div>

    <div class="main-content">
        <iframe data-tally-src="https://tally.so/embed/RGRaL4?hideTitle=1&transparentBackground=1&dynamicHeight=1" 
                loading="lazy" width="100%" height="550" frameborder="0"></iframe>
    </div>
</div>

<script async src="https://tally.so/Widgets/embed.js"></script>
</body>
</html>
