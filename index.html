<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printasaur | Idea Lab</title>
    <style>
        :root { --main-green: #9ACD32; --dark-bg: #0d0d0d; --card-bg: #161616; }
        
        body { 
            background-color: var(--dark-bg); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }

        .dashboard { 
            display: grid; 
            grid-template-columns: 1fr 1.5fr; 
            max-width: 1000px; 
            width: 95%; 
            background: var(--card-bg); 
            border-radius: 24px; 
            overflow: hidden; 
            border: 1px solid #222;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* Kreisā puse (Info) */
        .sidebar { padding: 50px; border-right: 1px solid #222; background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%); }
        .logo { width: 120px; border-radius: 50%; border: 2px solid var(--main-green); margin-bottom: 30px; }
        h1 { color: var(--main-green); font-size: 2.5rem; margin: 0; line-height: 1.1; }
        .tagline { color: #666; font-size: 0.9rem; margin-top: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .description { margin-top: 40px; color: #bbb; line-height: 1.6; font-size: 1.1rem; }

        /* Labā puse (Forma) */
        .main-content { padding: 40px; background: #111; position: relative; }
        
        /* Mobile responsive */
        @media (max-width: 800px) {
            .dashboard { grid-template-columns: 1fr; }
            .sidebar { padding: 30px; text-align: center; border-right: none; border-bottom: 1px solid #222; }
            .description { margin-top: 20px; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="sidebar">
        <img src="logo.jpg" class="logo" alt="Printasaur">
        <h1>PRINTASAUR<br>IDEA LAB</h1>
        <div class="tagline">Bambu Lab P1S Station</div>
        <p class="description">
            Testējam jaunus dizainus! Kādu piekariņu mums vajadzētu izprintēt nākamo? <br><br>
            <strong>Uzraksti savu domu un skaties, kā tā atdzīvojas veikalā.</strong>
        </p>
    </div>

    <div class="main-content">
        <iframe data-tally-src="https://tally.so/embed/RGRaL4?hideTitle=1&transparentBackground=1&dynamicHeight=1" 
                loading="lazy" width="100%" height="550" frameborder="0"></iframe>
    </div>
</div>

<script async src="https://tally.so/Widgets/embed.js"></script>
</body>
</html>
