<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printasaur | Idea Lab 🦖</title>
    <style>
        :root { 
            --main-green: #9ACD32; 
            --dark-bg: #0a0a0a; 
            --card-bg: #111111; 
            --border-color: #222;
        }
        
        body { 
            background-color: var(--dark-bg); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }

        .nav-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        .nav-links { display: flex; gap: 15px; }

        .nav-btn {
            background: #1a1a1a;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: 0.3s;
        }

        .nav-btn.active { border-color: var(--main-green); color: var(--main-green); background: rgba(154, 205, 50, 0.1); }

        .dashboard { 
            display: grid; 
            grid-template-columns: 1fr 1.4fr; 
            max-width: 1000px; 
            width: 100%; 
            background: var(--card-bg); 
            border-radius: 28px; 
            overflow: hidden; 
            border: 1px solid var(--border-color);
        }

        .sidebar { 
            padding: 60px 40px; 
            border-right: 1px solid var(--border-color); 
            background: linear-gradient(180deg, #161616 0%, #0a0a0a 100%); 
        }

        .logo { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--main-green); padding: 5px; margin-bottom: 25px; }
        h1 { color: var(--main-green); font-size: 2.2rem; margin: 0; font-weight: 800; }
        .description { margin-top: 30px; color: #999; line-height: 1.6; }

        .main-content { 
            background: #0d0d0d; 
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Rezerves poga, ja nekas neielādējas */
        .fallback-link {
            color: var(--main-green);
            text-decoration: underline;
            cursor: pointer;
        }

        @media (max-width: 850px) {
            .dashboard { grid-template-columns: 1fr; }
            .sidebar { padding: 40px; text-align: center; border-right: none; border-bottom: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

<div class="nav-bar">
    <div style="font-weight: 800; font-size: 1.2rem; color: var(--main-green);">PRINTASAUR</div>
    <div class="nav-links">
        <a href="index.html" class="nav-btn active">Idea Lab</a>
        <a href="kolekcija.html" class="nav-btn">Kolekcija</a>
    </div>
</div>

<div class="dashboard">
    <div class="sidebar">
        <img src="logo.jpg" class="logo" alt="Printasaur">
        <h1>IDEA LAB</h1>
        <p class="description">
            Testējam jaunus dizainus! Iesaki savu ideju un skaties, kā tā atdzīvojas mūsu veikalā.
        </p>
    </div>

    <div class="main-content">
        <iframe src="https://tally.so/embed/RGRaL4?hideTitle=1&transparentBackground=1" 
                style="width: 100%; height: 600px; border: none;">
        </iframe>
    </div>
</div>

</body>
</html>
